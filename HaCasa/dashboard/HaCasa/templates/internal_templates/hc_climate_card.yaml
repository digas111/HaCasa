hc_climate_card:
  variables:
    show_graph: true
    graph_entity:
    graph_color: var(--color-red)
    setpoint_label: "Target Temperature: "
    mode_selector_hash:
    show_mode_buttons: false
  show_label: true
  show_state: true
  tap_action:
    action: more-info
    haptic: heavy

  state_display: |
    [[[
      const attrs = states[entity.entity_id]?.attributes ?? {};
      const mode = states[entity.entity_id]?.state;
      const single = Number(attrs.temperature ?? attrs.target_temperature);
      const low = Number(attrs.target_temp_low ?? attrs.target_temperature_low);
      const high = Number(attrs.target_temp_high ?? attrs.target_temperature_high);

      if (mode === 'heat' && Number.isFinite(single)) {
        return `${variables.setpoint_label} ${Math.round(single)}°`;
      }
      if (mode === 'cool' && Number.isFinite(single)) {
        return `${variables.setpoint_label} ${Math.round(single)}°`;
      }
      if (mode === 'heat' && Number.isFinite(low)) {
        return `${variables.setpoint_label} ${Math.round(low)}°`;
      }
      if (mode === 'cool' && Number.isFinite(high)) {
        return `${variables.setpoint_label} ${Math.round(high)}°`;
      }
      if (Number.isFinite(low) && Number.isFinite(high)) {
        return `${variables.setpoint_label} ${Math.round(low)}-${Math.round(high)}°`;
      }
      if (Number.isFinite(low)) {
        return `${variables.setpoint_label} ${Math.round(low)}°`;
      }
      if (Number.isFinite(high)) {
        return `${variables.setpoint_label} ${Math.round(high)}°`;
      }
      if (Number.isFinite(single)) {
        return `${variables.setpoint_label} ${Math.round(single)}°`;
      }
      return `${variables.setpoint_label} —`;
    ]]]
  label: |
    [[[
      const current = Number(states[entity.entity_id]?.attributes?.current_temperature);

      if (Number.isFinite(current)) {
        return `${Math.round(current)}<sup style="font-size: 40px;">°</sup>`;
      }
      return '—';
    ]]]
  show_icon: false
  styles:
    grid:
      - grid-template-areas: |
          'l buttons'
          'n buttons'
          's buttons'
          'mode_selector mode_selector'
          'mode_buttons mode_buttons'
          'graph graph'
      - grid-template-rows: repeat(3, min-content) min-content min-content min-content
    card:
      - padding: 20px
      - overflow: visible
    name:
      - justify-self: start
      - align-self: end
      - font-weight: 600
      - font-size: 14px
      - z-index: 2
      - margin-bottom: -7px
      - pointer-events: none
    label:
      - font-size: 70px
      - justify-self: start
      - align-self: start
      - font-weight: 700
      - z-index: 2
    state:
      - justify-self: start
      - color: var(--subtext-color)
      - font-size: 12px
      - margin-top: 4px
      - font-weight: 500
      - z-index: 2
    custom_fields:
      mode_selector:
        - display: |
            [[[
              return variables.show_mode_buttons ? 'none' : 'block';
            ]]]
        - margin-top: 14px
        - z-index: 3
        - align-self: stretch
        - overflow: visible
      mode_buttons:
        - display: |
            [[[
              return variables.show_mode_buttons ? 'block' : 'none';
            ]]]
        - margin-top: 14px
        - z-index: 3
        - align-self: stretch
        - overflow: visible
      graph:
        - display: |
            [[[ return variables.show_graph && variables.graph_entity ? 'block' : 'none' ]]]
        - position: absolute
        - left: 0
        - bottom: -1px
        - width: 100%
        - z-index: 1

  custom_fields:
    mode_selector:
      card:
        type: custom:button-card
        entity: "[[[ return entity.entity_id ]]]"
        name: |
          [[[
            const labels = {
              off: 'Off',
              heat_cool: 'Auto',
              cool: 'Cool',
              heat: 'Heat',
              fan_only: 'Fan',
              dry: 'Dry',
            };
            return labels[entity.state] ?? entity.state;
          ]]]
        icon: mdi:chevron-down
        show_name: true
        show_state: false
        show_icon: true
        tap_action:
          action: |
            [[[
              return variables.mode_selector_hash ? 'navigate' : 'more-info';
            ]]]
          haptic: heavy
          navigation_path: |
            [[[
              return variables.mode_selector_hash || undefined;
            ]]]
        hold_action:
          action: more-info
          haptic: heavy
        styles:
          card:
            - background: var(--button-card-background)
            - box-shadow: none
            - padding: 14px 16px
            - border-radius: 18px
          grid:
            - grid-template-areas: '"n i"'
            - grid-template-columns: 1fr min-content
          name:
            - justify-self: start
            - align-self: center
            - font-size: 16px
            - font-weight: 700
          icon:
            - justify-self: end
            - align-self: center
            - width: 18px
            - color: var(--subtext-color)
    mode_buttons:
      card:
        type: grid
        columns: 2
        square: false
        cards:
          - &climate_mode_inline_button
            type: custom:button-card
            entity: "[[[ return entity.entity_id ]]]"
            show_name: true
            show_icon: false
            show_state: false
            hold_action:
              action: none
              haptic: heavy
            styles:
              card:
                - height: 52px
                - border-radius: 16px
                - background: var(--ha-card-background)
                - border: 1px solid var(--divider-color)
                - box-shadow: none
              name:
                - font-size: 15px
                - font-weight: 700
                - justify-self: center
                - align-self: center
                - color: var(--primary-text-color)
            state:
              - operator: template
                value: |
                  [[[
                    return entity?.state === variables.option_value;
                  ]]]
                styles:
                  card:
                    - background: var(--primary-color)
                    - border: 1px solid var(--primary-color)
                  name:
                    - color: white
            tap_action:
              action: call-service
              haptic: heavy
              service: climate.set_hvac_mode
              target:
                entity_id: "[[[ return entity.entity_id ]]]"
              data:
                hvac_mode: "off"
            variables:
              option_value: "off"
              option_label: "Off"
            name: |
              [[[
                return variables.option_label;
              ]]]
          - <<: *climate_mode_inline_button
            variables:
              option_value: "heat_cool"
              option_label: "Auto"
            tap_action:
              action: call-service
              haptic: heavy
              service: climate.set_hvac_mode
              target:
                entity_id: "[[[ return entity.entity_id ]]]"
              data:
                hvac_mode: heat_cool
          - <<: *climate_mode_inline_button
            variables:
              option_value: "cool"
              option_label: "Cool"
            tap_action:
              action: call-service
              haptic: heavy
              service: climate.set_hvac_mode
              target:
                entity_id: "[[[ return entity.entity_id ]]]"
              data:
                hvac_mode: cool
          - <<: *climate_mode_inline_button
            variables:
              option_value: "heat"
              option_label: "Heat"
            tap_action:
              action: call-service
              haptic: heavy
              service: climate.set_hvac_mode
              target:
                entity_id: "[[[ return entity.entity_id ]]]"
              data:
                hvac_mode: heat
          - <<: *climate_mode_inline_button
            variables:
              option_value: "fan_only"
              option_label: "Fan"
            tap_action:
              action: call-service
              haptic: heavy
              service: climate.set_hvac_mode
              target:
                entity_id: "[[[ return entity.entity_id ]]]"
              data:
                hvac_mode: fan_only
          - <<: *climate_mode_inline_button
            variables:
              option_value: "dry"
              option_label: "Dry"
            tap_action:
              action: call-service
              haptic: heavy
              service: climate.set_hvac_mode
              target:
                entity_id: "[[[ return entity.entity_id ]]]"
              data:
                hvac_mode: dry
    buttons:
      card:
        type: custom:button-card
        styles:
          grid:
            - grid-template-areas: |
                'item_1'
                'item_2'
                'item_3'
            - row-gap: 1.20
          card:
            - padding: 10px
            - border-radius: 50px
            - box-shadow: none
            - background-color: var(--button-card-background)
            - z-index: 3
          custom_fields:
            item_2:
              - opacity: 0.7
        custom_fields:
          item_1:
            card:
              type: custom:button-card
              icon: mdi:chevron-up
              styles: &icon_style
                icon:
                  - width: 25px
                card:
                  - padding: 10px
                  - border-radius: 500px
                  - box-shadow: none
                  - background: none
              tap_action:
                action: call-service
                haptic: heavy
                service: climate.set_temperature
                data: |
                  [[[
                    const attrs = states[entity.entity_id]?.attributes ?? {};
                    const mode = states[entity.entity_id]?.state;
                    const step = Number(
                      attrs.target_temp_step
                      ?? attrs.target_temperature_step
                      ?? 1
                    );
                    const delta = Number.isFinite(step) ? step : 1;
                    const single = Number(attrs.temperature ?? attrs.target_temperature);
                    const low = Number(attrs.target_temp_low ?? attrs.target_temperature_low);
                    const high = Number(attrs.target_temp_high ?? attrs.target_temperature_high);

                    if (mode === 'heat_cool' && Number.isFinite(low) && Number.isFinite(high)) {
                      return {
                        target_temp_low: low + delta,
                        target_temp_high: high + delta,
                      };
                    }

                    const target =
                      Number.isFinite(single)
                        ? single
                        : mode === 'cool'
                          ? high
                          : low;

                    return Number.isFinite(target)
                      ? { temperature: target + delta }
                      : {};
                  ]]]
                target:
                  entity_id: "[[[ return entity.entity_id ]]]"
              show: |
                [[[
                  const mode = states[entity.entity_id]?.state;
                  return mode === 'heat' || mode === 'cool' || mode === 'heat_cool';
                ]]]
          item_2: |
            [[[
              const attrs = states[entity.entity_id]?.attributes ?? {};
              const mode = states[entity.entity_id]?.state;
              const single = Number(attrs.temperature ?? attrs.target_temperature);
              const low = Number(attrs.target_temp_low ?? attrs.target_temperature_low);
              const high = Number(attrs.target_temp_high ?? attrs.target_temperature_high);

              if (mode === 'heat' && Number.isFinite(single)) {
                return `${Math.round(single)}°`;
              }
              if (mode === 'cool' && Number.isFinite(single)) {
                return `${Math.round(single)}°`;
              }
              if (mode === 'heat' && Number.isFinite(low)) {
                return `${Math.round(low)}°`;
              }
              if (mode === 'cool' && Number.isFinite(high)) {
                return `${Math.round(high)}°`;
              }
              if (Number.isFinite(low) && Number.isFinite(high)) {
                return `${Math.round(low)}-${Math.round(high)}°`;
              }
              if (Number.isFinite(low)) {
                return `${Math.round(low)}°`;
              }
              if (Number.isFinite(high)) {
                return `${Math.round(high)}°`;
              }
              if (Number.isFinite(single)) {
                return `${Math.round(single)}°`;
              }
              return '—';
            ]]]
          item_3:
            card:
              type: custom:button-card
              icon: mdi:chevron-down
              styles: *icon_style
              tap_action:
                action: call-service
                haptic: heavy
                service: climate.set_temperature
                data: |
                  [[[
                    const attrs = states[entity.entity_id]?.attributes ?? {};
                    const mode = states[entity.entity_id]?.state;
                    const step = Number(
                      attrs.target_temp_step
                      ?? attrs.target_temperature_step
                      ?? 1
                    );
                    const delta = Number.isFinite(step) ? step : 1;
                    const single = Number(attrs.temperature ?? attrs.target_temperature);
                    const low = Number(attrs.target_temp_low ?? attrs.target_temperature_low);
                    const high = Number(attrs.target_temp_high ?? attrs.target_temperature_high);

                    if (mode === 'heat_cool' && Number.isFinite(low) && Number.isFinite(high)) {
                      return {
                        target_temp_low: low - delta,
                        target_temp_high: high - delta,
                      };
                    }

                    const target =
                      Number.isFinite(single)
                        ? single
                        : mode === 'cool'
                          ? high
                          : low;

                    return Number.isFinite(target)
                      ? { temperature: target - delta }
                      : {};
                  ]]]
                target:
                  entity_id: "[[[ return entity.entity_id ]]]"
              show: |
                [[[
                  const mode = states[entity.entity_id]?.state;
                  return mode === 'heat' || mode === 'cool' || mode === 'heat_cool';
                ]]]
    graph:
      card:
        type: custom:mini-graph-card
        entities:
          - entity: "[[[ return variables.graph_entity ]]]"
            show_fill: true
            show_line: false
        show:
          name: false
          icon: false
          state: false
          points: false
          labels: false
        height: 100
        line_width: 2
        line_color: "[[[ return variables.graph_color ]]]"
        card_mod:
          style: |
            ha-card {
              background: none;
              box-shadow: none;
              --ha-card-border-width: 0;
              z-index: 1;
            }
        tap_action:
          action: more-info
          haptic: heavy
