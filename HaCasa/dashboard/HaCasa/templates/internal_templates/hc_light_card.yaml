hc_light_card:
  icon: mdi:lightbulb
  template: hc_base_card
  variables:
    enable_slider: |
      [[[
        if (states[entity.entity_id].attributes.brightness) {
          return true;
        } else {
          return false;
        }
      ]]]
  label: |
    [[[
      if (states[entity.entity_id].attributes.brightness) {
        var bri = (Math.round(states[entity.entity_id].attributes.brightness / 2.55));
        return variables.custom_label + (bri ? bri + '%': 'Off');
      }
      else {
        return '';
      }
    ]]]
  styles:
    name:
      - text-align: left
      - font-size: 18px
      - font-weight: 500
      - justify-self: start
      - align-self: start
      - overflow: visible
    icon:
      - color: white
    grid:
      - grid-template-areas: |
          [[[
            if (variables.enable_slider && states[entity.entity_id].attributes.brightness) {
                return '"n i" "l i" "slider slider"';
            }
              return '". i" "n n" "l l"';
          ]]]
      - grid-template-rows: min-content min-content 1fr
    custom_fields:
      slider:
        - display: >
            [[[
              if (variables.enable_slider && states[entity.entity_id].attributes.brightness) {
                  return "block";
              }
              return "none";
            ]]]
  state:
    - value: "on"
      styles:
        card:
          - background: "[[[ return variables.card_color ]]]"
        name:
          - color: white
        label:
          - color: white
        state:
          - color: white
    - value: "off"
      styles:
        card:
          - color: red
          - background: "[[[ return variables.card_color ]]]"
        icon:
          - color: red
        img_cell:
          - background: var(--background-icon-color-default)
    - value: "unavailable"
      styles:
        name:
          - text-decoration: line-through
        icon:
          - color: white
        img_cell:
          - background: var(--background-icon-color-default)
        card:
          - opacity: 0.6
          - pointer-events: none
      label: Unknown
      icon: mdi:lightbulb-question
  custom_fields:
    slider:
      card:
        type: custom:my-slider-v2
        entity: "[[[ return entity.entity_id ]]]"
        mode: brightness
        styles:
          card:
            - height: 30px
            - box-shadow: none
            - padding: 0
            - touch-action: pan-y
            - background: |
                [[[
                  if (states[entity.entity_id].state === 'off') {
                    return 'var(--background)';
                  } else {
                    return variables.card_color;
                  }
                ]]]
            - border-radius: 12px
          progress:
            - height: 100%
            - touch-action: pan-y
            - background: |
                [[[
                  if (states[entity.entity_id].state === 'off') {
                    return variables.card_color;
                  } else {
                    return 'white';
                  }
                ]]]
            - border-radius: 12px
          track:
            - touch-action: pan-y
            - background: |
                [[[
                  if (states[entity.entity_id].state === 'on') {
                    return 'var(--opacity-contrast-100)';
                  } else {
                    return 'var(--slider-color)';
                  }
                ]]]

            - border-radius: 12px
          thumb:
            - touch-action: pan-y
            - height: 30%
            - background: |
                [[[
                  if (states[entity.entity_id].state === 'off') {
                    return 'white';
                  } else {
                    return variables.card_color;
                  }
                ]]]
            - position: absolute
            - right: 7px
            - top: 11px
            - width: 3px
  hold_action:
    action: more-info
    haptic: heavy
