hc_navigation_card:
  show_name: true
  show_icon: true
  show_state: false
  show_label: true
  variables:
    hc_label_prefix: "On - "
    hc_icon_color: ""
    hc_color: "var(--color-blue)"
  label: |
    [[[ return variables.hc_label_prefix + states[entity.entity_id].state ]]]
  styles:
    grid:
      - grid-template-areas: |
          "n n"
          "l l"
      - grid-template-rows: 1fr 1fr
    card:
      - padding: 20px
      - height: auto
    name:
      - text-align: left
      - font-size: 16px
      - font-weight: 800
      - justify-self: start
      - align-self: start
    label:
      - justify-self: start
      - align-self: end
      - font-size: 12px
      - font-weight: 600
      - color: var(--subtext-color)
    img_cell:
      - position: absolute
      - top: 20%
      - left: 40%
      - overflow: visible
    icon:
      - position: absolute
      - width: 15em
      - opacity: 90%
      - color: "var(--primary-color)"

hc_navigation_card_security:
  template: hc_navigation_card
  state:
    - value: arming
      label: Arming...
      icon: hacasa:shield
      styles:
        icon:
          - color: var(--color-orange)
          - animation: flash 5s infinite
        label:
          - animation: flash 5s infinite
    - value: armed_home
      label: Armed Home
      icon: hacasa:shield-check
      styles:
        card:
          - background: var(--color-green)
        icon:
          - color: white
        name:
          - color: white
        label:
          - color: white
    - value: armed_away
      label: Armed Away
      icon: hacasa:shield-keyhole
      styles:
        card:
          - background: var(--color-green)
        name:
          - color: white
        label:
          - color: white
        icon:
          - color: white
    - value: disarmed
      label: Disarmed
      icon: hacasa:shield
      styles:
        icon:
          - color: var(--primary-color)
    - value: triggered
      label: Triggered!
      icon: hacasa:shield-exclamation
      styles:
        icon:
          - color: white
          - animation: flash 2s infinite
        name:
          - color: white
        state:
          - color: white
        label:
          - color: white

  extra_styles: |
    @keyframes flash {
      0% {opacity: 100%;}
      50% {opacity: 0%;}
      100% {opacity: 100%;}
    }

hc_room_card:
  template: hc_navigation_card
  variables:
    light_entities: |
      [[[
        const ids = states[entity.entity_id]?.attributes?.entity_id;
        if (Array.isArray(ids)) {
          return ids;
        }
        return entity?.entity_id ? [entity.entity_id] : [];
      ]]]
    lights_target_entity: |
      [[[
        return entity.entity_id;
      ]]]
  label: |
    [[[
      const ids = Array.isArray(variables.light_entities)
        ? variables.light_entities
        : (states[entity.entity_id]?.attributes?.entity_id || []);
      const onCount = ids.filter((id) => states[id] && states[id].state === 'on').length;
      if (onCount === 0) {
        return '';
      }
      return onCount === 1 ? '1 light on' : `${onCount} lights on`;
    ]]]
  state:
    - value: "on"
      styles:
        card:
          - background: var(--color-orange)
        name:
          - color: white
        label:
          - color: white
        icon:
          - color: white
    - value: "off"
      styles:
        icon:
          - color: var(--color-orange)
  styles:
    grid:
      - grid-template-areas: |
          "n n"
          "l l"
      - grid-template-rows: min-content 18px
      - align-content: start
      - row-gap: 0
    card:
      - min-height: 128px
      - padding: 0 12px 12px 12px
      - position: relative
      - background: |
          [[[
            const ids = Array.isArray(variables.light_entities)
              ? variables.light_entities
              : [variables.lights_target_entity];
            return ids.some((id) => states[id]?.state === 'on')
              ? 'var(--color-orange)'
              : 'var(--ha-card-background)';
          ]]]
    img_cell:
      - top: 30%
      - left: 30%
    icon:
      - width: 12em
      - opacity: 78%
      - color: |
          [[[
            const ids = Array.isArray(variables.light_entities)
              ? variables.light_entities
              : [variables.lights_target_entity];
            return ids.some((id) => states[id]?.state === 'on')
              ? 'white'
              : 'var(--color-orange)';
          ]]]
    name:
      - align-self: start
      - margin-top: -30px
      - line-height: 1
      - color: |
          [[[
            const ids = Array.isArray(variables.light_entities)
              ? variables.light_entities
              : [variables.lights_target_entity];
            return ids.some((id) => states[id]?.state === 'on') ? 'white' : 'inherit';
          ]]]
    label:
      - align-self: start
      - margin-top: -15px
      - min-height: 18px
      - line-height: 18px
      - padding-bottom: 54px
      - color: |
          [[[
            const ids = Array.isArray(variables.light_entities)
              ? variables.light_entities
              : [variables.lights_target_entity];
            return ids.some((id) => states[id]?.state === 'on') ? 'white' : 'var(--subtext-color)';
          ]]]
    custom_fields:
      lights_button:
        - position: absolute
        - left: 12px
        - bottom: 12px
        - margin: 0
        - z-index: 2
        - display: |
            [[[
              const ids = Array.isArray(variables.light_entities)
                ? variables.light_entities
                : [variables.lights_target_entity];
              return ids.filter(Boolean).length ? 'block' : 'none';
            ]]]
  custom_fields:
    lights_button:
      card:
        type: custom:button-card
        entity: |
          [[[
            const ids = Array.isArray(variables.light_entities)
              ? variables.light_entities
              : [variables.lights_target_entity];
            return ids[0] || variables.lights_target_entity;
          ]]]
        show_name: false
        show_state: false
        show_icon: true
        icon: |
          [[[
            const ids = Array.isArray(variables.light_entities)
              ? variables.light_entities
              : [variables.lights_target_entity];
            return ids.some((id) => states[id]?.state === 'on')
              ? 'mdi:lightbulb-group'
              : 'mdi:lightbulb-group-off-outline';
          ]]]
        tap_action:
          action: call-service
          haptic: heavy
          service: light.turn_off
          data:
            entity_id: |
              [[[
                const ids = Array.isArray(variables.light_entities)
                  ? variables.light_entities
                  : [variables.lights_target_entity];
                return ids.filter(Boolean);
              ]]]
        styles:
          card:
            - width: 42px
            - height: 42px
            - padding: 0
            - border-radius: 999px
            - box-shadow: none
            - background: |
                [[[
                  const ids = Array.isArray(variables.light_entities)
                    ? variables.light_entities
                    : [variables.lights_target_entity];
                  return ids.some((id) => states[id]?.state === 'on')
                    ? 'rgba(255, 255, 255, 0.24)'
                    : 'var(--ha-card-background)';
                ]]]
            - border: |
                [[[
                  const ids = Array.isArray(variables.light_entities)
                    ? variables.light_entities
                    : [variables.lights_target_entity];
                  return ids.some((id) => states[id]?.state === 'on')
                    ? 'none'
                    : '1px solid var(--divider-color)';
                ]]]
          icon:
            - width: 56%
            - color: |
                [[[
                  const ids = Array.isArray(variables.light_entities)
                    ? variables.light_entities
                    : [variables.lights_target_entity];
                  return ids.some((id) => states[id]?.state === 'on')
                    ? 'white'
                    : 'var(--color-orange)';
                ]]]
